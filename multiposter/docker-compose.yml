services:
  multiposter:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      # Port publié uniquement sur 127.0.0.1 ci-dessous : usage local. Pour un serveur en ligne,
      # retire LOCAL_MODE et définis APP_URL en https (mode serveur, double authentification).
      LOCAL_MODE: "1"
    volumes:
      - multiposter-data:/data
    ports:
      - "127.0.0.1:3210:3210"

volumes:
  multiposter-data:
