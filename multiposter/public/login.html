<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connexion · Multiposter</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login">
  <form method="post" action="/login" class="card login-card">
    <img src="/assets/logo.png" alt="" width="64" height="64">
    <h1>Multiposter</h1>
    <p class="muted">Pixels Perspective</p>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p class="error" id="err" hidden></p>
    <button class="btn primary" type="submit">Se connecter</button>
  </form>
  <script>
    const e = new URLSearchParams(location.search).get("e");
    if (e) {
      const el = document.getElementById("err");
      el.hidden = false;
      el.textContent = e === "wait" ? "Trop d'essais, réessaie dans 15 minutes." : "Mot de passe incorrect.";
    }
  </script>
</body>
</html>
