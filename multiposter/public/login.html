<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connexion · PTZ Posting</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login">
  <form method="post" action="/login" class="card login-card">
    <img src="/assets/logo.png" alt="" width="104" height="104">
    <h1>PTZ Posting</h1>
    <p class="muted">PTZ Corp</p>
    <label for="name">Identifiant (adresse e-mail)</label>
    <input id="name" name="name" autocomplete="username" inputmode="email" maxlength="100">
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div id="code-row" hidden>
      <label for="code">Code de l'appli d'authentification</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="6 chiffres, ou un code de secours">
      <p class="muted small hint">Première connexion ? Laisse ce champ vide : l'app te fera activer la double authentification juste après.</p>
    </div>
    <p class="error" id="err" hidden></p>
    <button class="btn primary" type="submit">Se connecter</button>
    <p class="help-link"><a href="/aide#connexion">Besoin d'aide pour te connecter ?</a></p>
  </form>
  <script src="/assets/login.js"></script>
</body>
</html>
