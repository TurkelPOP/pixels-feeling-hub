<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background central gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#140236"/>
      <stop offset="12%" stop-color="#28066b"/>
      <stop offset="28%" stop-color="#4e0cc7"/>
      <stop offset="50%" stop-color="#6713ea"/>
      <stop offset="72%" stop-color="#4e0cc7"/>
      <stop offset="88%" stop-color="#28066b"/>
      <stop offset="100%" stop-color="#140236"/>
    </linearGradient>

    <!-- Subtle vertical lighting depth -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6713ea" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern for the gamepad elements -->
    <pattern id="gamingPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <!-- Grid cross / plus -->
      <path d="M 24 6 L 24 14 M 20 10 L 28 10" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
      <!-- Circle with dot -->
      <circle cx="24" cy="34" r="5" fill="none" stroke="#a855f7" stroke-width="1.6" opacity="0.3"/>
      <circle cx="24" cy="34" r="1.5" fill="#a855f7" opacity="0.4"/>
      <!-- Left / Right side dots & crosses offset -->
      <circle cx="6" cy="10" r="1.2" fill="#c084fc" opacity="0.25"/>
      <circle cx="42" cy="10" r="1.2" fill="#c084fc" opacity="0.25"/>
      <circle cx="6" cy="34" r="1.2" fill="#c084fc" opacity="0.25"/>
      <circle cx="42" cy="34" r="1.2" fill="#c084fc" opacity="0.25"/>

      <path d="M 0 24 L 6 24 M 42 24 L 48 24" stroke="#a855f7" stroke-width="1.4" opacity="0.25"/>
      <circle cx="0" cy="24" r="3.5" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.25"/>
      <circle cx="48" cy="24" r="3.5" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.25"/>
    </pattern>

    <!-- Side mask gradients to fade the pattern towards the center -->
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="leftMask">
      <rect x="0" y="0" width="480" height="1080" fill="url(#leftFade)"/>
    </mask>

    <linearGradient id="rightFade" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="rightMask">
      <rect x="1440" y="0" width="480" height="1080" fill="url(#rightFade)"/>
    </mask>
  </defs>

  <!-- Solid Base Gradient -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>

  <!-- Left Side Pattern Band -->
  <rect x="0" y="0" width="480" height="1080" fill="url(#gamingPattern)" mask="url(#leftMask)"/>

  <!-- Right Side Pattern Band -->
  <rect x="1440" y="0" width="480" height="1080" fill="url(#gamingPattern)" mask="url(#rightMask)"/>
</svg>
